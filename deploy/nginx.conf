# Round-robin over the app replicas. Docker's embedded DNS returns every replica's IP for "app";
# re-resolve periodically so `--scale app=N` changes are picked up without restarting nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream support_app {
    zone support_app 64k;
    server app:8080 resolve;
    keepalive 64;
}

server {
    listen 8080;

    location / {
        proxy_pass http://support_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_read_timeout 45s;  # > TURN_TIMEOUT_S (30s): the app degrades before nginx gives up
        proxy_next_upstream error timeout;
    }
}
