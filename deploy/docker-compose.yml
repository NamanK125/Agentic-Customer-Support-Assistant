# Local scale-out demo: N stateless app replicas behind nginx, Redis for shared state, Jaeger for
# traces (OTLP gRPC on 4317, UI on http://localhost:16686).
#
#   docker compose -f deploy/docker-compose.yml up --build --scale app=3
#   curl -s localhost:8080/v1/chat -H 'content-type: application/json' \
#        -d '{"session_id":"demo-1","text":"where is PN-10002?"}'
#
# LLM_* settings come from ../.env. If the LLM runs on the host, use
# LLM_BASE_URL=http://host.docker.internal:8000/v1 rather than localhost.

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file: ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: support-assistant
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - hf-cache:/app/.cache/huggingface  # embedding model downloaded once, shared by replicas
    deploy:
      replicas: 3
    depends_on:
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    restart: unless-stopped

  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - app

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "512mb",
              "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # UI
      - "4317:4317"    # OTLP gRPC

volumes:
  hf-cache:
