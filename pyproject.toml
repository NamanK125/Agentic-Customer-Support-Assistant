[project]
name = "support-assistant"
version = "0.1.0"
description = "Agentic customer support assistant (text + voice) for PulseNest home health devices"
requires-python = ">=3.11,<3.14"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tenacity>=8.3",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "redis>=5.0",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "datasets>=2.20",
    "huggingface-hub>=0.23",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "import-linter>=2.0",
    "fakeredis>=2.23",
    "httpx>=0.27",
]

[project.scripts]
support-assistant = "support_assistant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_assistant"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: needs a running LLM endpoint (deselect with -m 'not live')"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# hand-written eval utterances are kept on one line each
"scripts/fetch_datasets.py" = ["E501"]

# Structural guarantee: only the input guardrail may mint a CheckedMessage.
# The seal lives in support_assistant._seal; nothing outside guardrails/contracts may import it.
[tool.importlinter]
root_package = "support_assistant"

[[tool.importlinter.contracts]]
name = "Only the guardrails package may import the CheckedMessage seal"
type = "forbidden"
source_modules = [
    "support_assistant.harness",
    "support_assistant.rag",
    "support_assistant.tools",
    "support_assistant.agents",
    "support_assistant.llm",
    "support_assistant.observability",
    "support_assistant.api",
    "support_assistant.cli",
]
forbidden_modules = ["support_assistant._seal"]
# contracts.py imports the seal to verify it, so every package reaches it indirectly via
# contracts. The rule that matters is "nobody else can name the seal", i.e. direct imports.
allow_indirect_imports = true
